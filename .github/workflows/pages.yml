name: Deploy Unity WebGL



on:

  push:

    branches: [main]



permissions:

  contents: write
  
jobs:

  deploy:

    runs-on: ubuntu-latest



    steps:
      - name: Checkout
        uses: actions/checkout@v4
     
      - name: Deploy
        run : |
         git config user.name "github-actions"
         git config user.email "github-actions@github.com"
         git checkout --orphan gh-page
         git rm -rf .
         git checkout main -- index.html Build TemplateData
         git add index.html Build TemplateData
         git commit -m "Deploy Unity WebGL"
         git push origin gh-pages --force

        
