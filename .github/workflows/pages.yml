name: Deploy Unity WebGL



on:

  push:

    branches:

      - main



permissions:

  contents: write



jobs:

  deploy:

    runs-on: ubuntu-latest



    steps:

      - name: Checkout

        uses: actions/checkout@v4



      - name: Deploy

        uses: peaceiris/actions-gh-page@v4

        with:

          github_token:${{ secrets.GITHUB_TOKEN }}
          publish_dir:./deploy-pages@v4
